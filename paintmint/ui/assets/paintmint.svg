    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9eef2"/>
      <stop offset="0.5" stop-color="#b8c4cd"/>
      <stop offset="1" stop-color="#8d9ba6"/>
    </linearGradient>
